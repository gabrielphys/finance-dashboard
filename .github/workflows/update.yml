name: Aggiorna dati
on:
  schedule: [{cron: '*/15 6-21 * * 1-5'}]   # ogni 15 min nei giorni di borsa (UTC); GitHub può ritardare
  workflow_dispatch:
permissions: {contents: write}
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn openpyxl
      - run: cd scripts && ./run_all.sh
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || git commit -qm "Aggiornamento dati $(date -u +%H:%M)") && git push
